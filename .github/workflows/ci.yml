name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t challenge-inference:latest .

      - name: Check Python packages
        run: |
          docker run --rm \
            --entrypoint python \
            challenge-inference:latest \
            -c "import torch, cv2, onnxruntime, numpy; print('OK')"